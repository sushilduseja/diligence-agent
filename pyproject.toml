[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-agent"
version = "0.1.0"
description = "AI Due Diligence Agent - LangGraph prototype with parallel retrieval and human-in-the-loop"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-core",
    "httpx",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/dd_agent --cov-report=term-missing"
